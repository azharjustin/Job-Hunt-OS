<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Job Hunt OS — Personal command center for managing job applications, interviews, companies, resumes, follow-ups, and job-search analytics." />
  <meta name="theme-color" content="#6366f1" />
  <title>Job Hunt OS — Your Personal Job Search Command Center</title>
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('jhos_settings');
        var theme = saved ? JSON.parse(saved).theme : 'dark';
        if (theme === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
